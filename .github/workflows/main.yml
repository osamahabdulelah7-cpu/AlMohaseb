name: Build AlMohaseb APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o AlMohaseb_GitHub_Ready.zip -d extracted
          cp -r extracted/. extracted_project/
          echo "Extracted project:"
          ls -la extracted_project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: extracted_project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMohaseb-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
